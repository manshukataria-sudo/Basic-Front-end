<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus on today</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1 class="focus-on-today"><span>Focus on</span> Today</h1>
      <div class="container">
        <div class="header">
          <p class="today">
            Today
            <img src="images/Sun.svg" alt="sun" class="sun" />
          </p>
        </div>

        <p class="instructor">Raise the bar by completing your goals!</p>
        <div class="progress-bar"></div>
        <p class="goal-selector">Please set all the 3 goals!</p>

        <div class="goal-container">
          <input type="checkbox" class="checkbox-1 checkbox" />
          <input
            type="text"
            class="goal goal-1"
            placeholder="Add new goal... "
          />
        </div>
        <div class="goal-container">
          <input type="checkbox" class="checkbox-2 checkbox" />
          <input
            type="text"
            class="goal goal-2"
            placeholder="Add new goal... "
          />
        </div>
        <div class="goal-container">
          <input type="checkbox" class="checkbox-3 checkbox" />
          <input
            type="text"
            class="goal goal-3"
            placeholder="Add new goal... "
          />
        </div>
        <h5 class="motivator">“Move one step ahead, today!”</h5>
        <h6 class="love">Made with ❤️</h6>
      </div>
    </main>
  </body>
</html>
