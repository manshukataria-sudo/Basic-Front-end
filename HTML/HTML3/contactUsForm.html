<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Contact Us Form</h2>
    <form action="https://www.wikipedia.org/">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" placeholder="Enter Your Name" />
      <br />
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter Your Email"
      />
      <br />
      <label for="contactNumber">Contact Number</label>
      <input type="number" id="contactNumber" name="contactNumber" />
      <br />
      <label for="gender">Gender</label>
      <select name="gender" id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="ratherNotSay">Rather Not Say</option>
      </select>
      <br />
      <label for="dob">Date Of Birth</label>
      <input type="date" name="dob" id="dob" />
      <br />
      <label for="rating">Rating</label>
      <input type="radio" id="rating1" name="rating" value="1"/>
      <label for="rating1">1</label>
      <input type="radio" id="rating2" name="rating" value="2"/>
      <label for="rating2">2</label>
      <input type="radio" id="rating3" name="rating" value="3"/>
      <label for="rating3">3</label>
      <input type="radio" id="rating4" name="rating" value="4"/>
      <label for="rating4">4</label>
      <input type="radio" id="rating5" name="rating" value="5"/>
      <label for="rating5">5</label>
      <br />
      <br>
      <label for="message">Enter Your Message</label>
      <br />
      <textarea placeholder="Write Your Message" rows="8" cols="40" id="message">
      </textarea>

      <br />
      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
    <br />
    <a href="https://www.youtube.com/DoordarshanNational" target="_blank">
      <img
        src="/HTML/HTML3/images/youtube.png"
        width="60px"
        alt="our youtube channel"
      />
    </a>
    <a href="https://www.instagram.com/ddnational/" target="_blank">
      <img
        src="images/instagram.jpg"
        width="60px"
        alt="contact us on instagram"
      />
    </a>
    <a href="https://t.me/s/ddnewshindi?before=29369" target="_blank">
      <img
        src="images/telegram.jpg"
        width="60px"
        alt="message us on telegram"
      />
    </a>
  </body>
</html>
