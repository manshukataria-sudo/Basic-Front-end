<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- for selecting one option from given options list -->
    <h2>WELCOME</h2>
    <p>You can choose your favourite car here :</p>
    <form action="https://www.pexels.com/search/sports%20car/">
      <label for="selectCar">Choose your favourite car : </label>
      <select name="Cars" id="selectCar">
        <option value="audi">Audi</option>
        <option value="mercedes">Mercedes</option>
        <option value="lamborghini">lamborghini</option>
        <option value="ferrari">Ferrari</option>
        <option value="mustang">Mustang</option>
      </select>
      <br />
      <br />
      <input type="submit" name="Submit" />
    </form>
  </body>
</html>
