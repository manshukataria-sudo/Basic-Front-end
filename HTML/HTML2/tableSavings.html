<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      
      
       table,th,td{
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <caption>
      Savings
    </caption>
    <table>
      <thead>
        <th>Month</th>
        <th>Earning</th>
        <th>Expenditure</th>
        <th>Savings</th>
      </thead>
      <tbody>
        <tr>
          <td>January</td>
          <td>100</td>
          <td>90</td>
          <td>10</td>
        </tr>
        <tr>
          <td>February</td>
          <td>190</td>
          <td>80</td>
          <td>110</td>
        </tr>
        <tr>
          <td>March</td>
          <td>250</td>
          <td>100</td>
          <td>150</td>
        </tr>
        <tr>
          <td>April</td>
          <td>200</td>
          <td>60</td>
          <td>140</td>
        </tr>
        <tr>
          <td>May</td>
          <td>230</td>
          <td>100</td>
          <td>130</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td>970</td>
          <td>430</td>
          <td>540</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
