<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      table,
      tr,
      td,
      th {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <caption>
      My Savings
    </caption>
    <table>
      <tr>
        <td>Month</td>
        <td>Savings</td>
      </tr>
      <tr>
        <td>Jan</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Feb</td>
        <td>200</td>
      </tr>
      <tr>
        <td>March</td>
        <td>50</td>
      </tr>
      <tr>
        <td>Total</td>
        <td>350</td>
      </tr>
    </table>
    
    <br />
    <caption>
      Month Days
    </caption>
    <table>
      <thead>
        <tr>
          <th>Month</th>
          <th>Days</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Jan</td>
          <td>31</td>
        </tr>
        <tr>
          <td>Feb</td>
          <td>28/29</td>
        </tr>
        <tr>
          <td>Mar</td>
          <td>31</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td>Total</td>
        </tr>
      </tfoot>
    </table> 
  </body>
</html>
