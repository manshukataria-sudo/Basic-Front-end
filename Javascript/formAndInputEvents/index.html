<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Events and Event Object</title>
    <script src="scriptP.js" defer></script>
  </head>
  <body style="font-family: cursive">
    <h1>Form Events and Event Object</h1>
    <form action="" style="background-color: pink">
      <input type="text" id="username" name="username" />
      <!--input name is displayed on url and value of input is also dispalyed-->
      <input type="email" id="email" name="email" />
      <button>Click Me</button>
      <!--button submits form only when it is inside the form-->
    </form>
    <!--default type of button is sumbit-->
    <!-- button should be there to submit the form-->
    <p>Hello world</p>
  </body>
</html>
