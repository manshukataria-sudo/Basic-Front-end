<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav><h2>Counter</h2></nav>
      <hr class="border">
      <div class="count-result">
        <h1>0</h1>
      </div>
      <div class="control-buttons">
        <button id="minus-button" class="button">-</button>
        <button id="plus-button" class="button">+</button>
      </div>
      <div class="plus-minus-by">
        <label for="number">Increment/Decrement by: (1-10)</label>
        <input type="number" id="number"/>
      </div>
      <div class="reset-button">
        <button class="button">Reset</button>
      </div>
      <!-- <p class="keyboard-shortcuts">
        Keyboard shortcuts: + to increment, - to decrement, Page Up/Down to
        change step value
      </p> -->
    </main>
    <script src="app.js"></script>
  </body>
</html>
