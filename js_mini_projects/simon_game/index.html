<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h2>Simon Game</h2>
      <h4 class="instructor">Press 'ENTER' to start the game</h4>
      <div class="color-container">
        <div class="color-1 box" type="button"></div>
        <div class="color-2 box" type="button"></div>
        <div class="color-3 box" type="button"></div>
        <div class="color-4 box" type="button"></div>
      </div>
      <h3 class="game-over"><span>Game Over!!</span> Your score : <span class="score">00</span></h3>
    </main>
  </body>
</html>
