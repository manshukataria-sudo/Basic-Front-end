<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EQUILBRIUM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <img
          src="/CSS-Projects/EQUILBRIUM-CARD/disign_files/images/image-equilibrium.jpg"
          alt=""
          id="equil"
        />
        <h3>Equilibrium #3429</h3>
        <p>Our Equilibrium collection promotes balance and calm</p>
        <div class="svg">
          <span id="compass">
            <img
              src="/CSS-Projects/EQUILBRIUM-CARD/disign_files/images/icon-ethereum.svg"
              alt=""
            />
            <span id="eth">0.041ETH</span>
          </span>
          <span id="clock">
            <img
              src="/CSS-Projects/EQUILBRIUM-CARD/disign_files/images/icon-clock.svg"
              alt=""
            />
            <span id="3days">3 days left</span>
          </span>
        </div>
        <hr />
        <br>
        <div class="avatar">
          
          <img
            src="/CSS-Projects/EQUILBRIUM-CARD/disign_files/images/image-avatar.png"
            alt=""
            id="avatarImg"
          />
          <span id="avatarText">Creation of <span id="avatarName">Jules Wyvern</span></span>
        </div>
      </div>
    </div>
  </body>
</html>
